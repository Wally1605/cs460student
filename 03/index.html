<html>

<head>
    <style>
        html,
        body {
            background-color: #000;
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden !important;
        }
    </style>

    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@latest/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@latest/examples/jsm/"
      }
    }
    </script>

    <script type="module">

        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        var renderer, controls, scene, camera;
        var lastPlacedTknot = null;
        var isMouseDown = false;
        var flickering = false;
        var wireFrameEnabled = false;

        //list of all shapes
        var objects = [];

        window.onload = function () {
            // ALL SETUP CODE HERE
            // Three.js code goes here
            scene = new THREE.Scene();

            // setup the camera
            var fov = 75;
            var ratio = window.innerWidth / window.innerHeight;
            var zNear = 1;
            var zFar = 10000;
            camera = new THREE.PerspectiveCamera(fov, ratio, zNear, zFar);
            camera.position.set(0, 0, 100);

            // create renderer and setup the canvas
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // setup lights
            var ambientLight = new THREE.AmbientLight();
            scene.add(ambientLight);

            var light = new THREE.DirectionalLight(0xffffff, 5.0);
            light.position.set(10, 100, 10);
            scene.add(light);

            // configure tKnot
            var geometry = new THREE.TorusKnotGeometry(10, 3, 100, 16);
            var material = new THREE.MeshStandardMaterial({ color: 0x002D04, wireframe: false, transparent: true });

            var tKnot = new THREE.Mesh(geometry, material);
            objects.push(tKnot);

            scene.add(tKnot);




            //
            // The invisible plane
            //
            geometry = new THREE.PlaneGeometry(10000, 10000);
            material = new THREE.MeshBasicMaterial({
                visible: false
            });

            var invisible_plane = new THREE.Mesh(geometry, material);

            scene.add(invisible_plane);
            //
            //
            //



            // interaction
            controls = new OrbitControls(camera, renderer.domElement);

            // setup listeners

            renderer.domElement.onmousedown = function (e) {
                isMouseDown = true;
                if (e.shiftKey) {
                    console.log('clicked and held shift');
                    controls.enabled = false;
                    var pixel_coords = new THREE.Vector2(e.clientX, e.clientY);

                    console.log('Pixel coords', pixel_coords);

                    var vp_coords = new THREE.Vector2(
                        (pixel_coords.x / window.innerWidth) * 2 - 1,  //X
                        -(pixel_coords.y / window.innerHeight) * 2 + 1) // Y

                    console.log('Viewport coords', vp_coords);

                    var vp_coords_near = new THREE.Vector3(vp_coords.x, vp_coords.y, 0);


                    var raycaster = new THREE.Raycaster();
                    raycaster.setFromCamera(vp_coords_near, camera);
                    var intersects = raycaster.intersectObject(invisible_plane);

                    console.log('Ray to Invisible Plane', intersects[0].point);

                    // add new tknot at mouse position
                    var geometry = new THREE.TorusKnotGeometry(10, 3, 100, 16);
                    var material = new THREE.MeshStandardMaterial({ color: 0xFF69B4, wireframe: false, transparent: true });
                    var tKnot = new THREE.Mesh(geometry, material);

                    tKnot.position.set(intersects[0].point.x, intersects[0].point.y, intersects[0].point.z);
                    objects.push(tKnot);
                    scene.add(tKnot);
                    lastPlacedTknot = tKnot;

                    //scale tknot while mouse moves and keys are still pressed

                    renderer.domElement.onmousemove = function (e) {
                        console.log(e.movementX, e.movementY);
                        if (e.shiftKey && isMouseDown) {
                            var DELTA = -e.movementY * 0.05;

                            // set tknot to green if shape flips/inverts (y crosses 0)

                            if (lastPlacedTknot.scale.y < 0) {
                                lastPlacedTknot.material.color.set(0x39FF14);
                            } else {
                                lastPlacedTknot.material.color.set(0xFF69B4);
                            }

                            lastPlacedTknot.scale.set(lastPlacedTknot.scale.x + DELTA,
                                lastPlacedTknot.scale.y + DELTA,
                                lastPlacedTknot.scale.z + DELTA);
                        }
                    };



                }
            };


            renderer.domElement.onmouseup = function (e) {
                controls.enabled = true;
                isMouseDown = false;
            };

            //All shapes flicker on f key press OR enables wireframe on w press
            window.onkeydown = function (e) {
                if (e.key === 'f') {
                    flickering = true;
                }
                if (e.key === 'w') {
                    wireFrameEnabled = true;
                }
            };

            window.onkeyup = function (e) {
                if (e.key === 'f') {
                    flickering = false;
                }
                if (e.key === 'w') {
                    wireFrameEnabled = false;
                }
            };


            // call animation/rendering loop
            animate();

        };

        function animate() {

            requestAnimationFrame(animate);

            // and here..
            controls.update();
            renderer.render(scene, camera);

            //shapes visually flicker while f key is pressed, shapes fade in and out randomly

            objects.forEach(function (obj) {
                if (flickering) {
                    obj.material.opacity = Math.random();
                } else {
                    obj.material.opacity = 1;
                }

                if (wireFrameEnabled) {
                    obj.material.wireframe = true;
                } else {
                    obj.material.wireframe = false;
                }
            });

        };
    </script>
</head>

<body></body>

</html>
